[package]
name = "hashhelm"
version = "0.11.0"
edition = "2024"
default-run = "hashhelm"
description = "A lightweight password recovery workbench built with Rust and Hashcat for CTFs and digital forensics."
license-file = "LICENSE"
authors = ["DyNooob"]
homepage = "https://www.foren.dev"
repository = "https://github.com/DyNooob/HashHelm"
readme = "README.md"
include = ["src/**", "ui/**", "assets/**", ".cargo/config.toml", "build.rs", "Cargo.toml", "Cargo.lock", "LICENSE", "*.md", "tests/fixtures/**"]

[features]
default = ["desktop"]
desktop = ["dep:wry", "dep:tao", "dep:rfd"]

[[bin]]
name = "hashhelm"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17", default-features = false, optional = true }
cfb = "0.16"
roxmltree = "0.21"
base64 = "0.22"
lopdf = { version = "0.38", default-features = false }
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
zip = { version = "6.0.0", default-features = false, features = ["aes-crypto", "deflate"] }
sevenz-rust2 = { version = "=0.25.0", default-features = false, features = ["aes256", "util"] }
msoffice-crypto = { version = "=0.1.0-rc.13", default-features = false, features = ["crypto-ops", "legacy-binary"] }
unrar = "=0.5.8"
sha2 = "0.10.9"
crc32fast = "1.5.0"
tempfile = "3"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }
semver = "1"
aes = "0.8.4"
cipher = "0.4.4"
pbkdf2 = "0.12.2"
hmac = "0.12.1"
serpent = "0.5.1"
twofish = "0.7.1"
camellia = "0.1.0"
kuznyechik = "0.8.2"
ripemd = "0.1.3"
whirlpool = "0.10.4"
streebog = "0.10.2"
blake2 = "0.10.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"], optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Preserve metadata needed to load build-time procedural macros on macOS.
# The distributed executables retain the stripping configured above.
[profile.release.build-override]
strip = "none"
